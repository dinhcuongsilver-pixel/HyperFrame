<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HyperFrame Panel (Dev)</title>
    <style>
      body { background:#0b1220; color:#e6f0ff; font-family:Arial,Helvetica,sans-serif; margin:0; padding:16px }
      .panel { max-width:900px; margin:0 auto }
      .header { display:flex; align-items:center; gap:12px }
      .brand { font-size:20px; font-weight:700; color:#6be0a7 }
      .card { background:#071016; border:1px solid #123; padding:12px; margin-top:12px; border-radius:8px }
      .progress { height:16px; background:#021216; border-radius:8px; overflow:hidden; margin-top:8px }
      .progress > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#2dd1b3,#1fb6ff) }
      button { background:#0f1724; color:#aee6ff; border:1px solid #123; padding:8px 12px; border-radius:6px; cursor:pointer }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <div class="brand">HyperFrame</div>
        <div style="color:#9fb7c8">Premiere Pro Assistant (Dev)</div>
      </div>

      <div class="card">
        <div><strong>Backend status:</strong> <span id="status">disconnected</span></div>
        <div style="margin-top:8px"><button id="startFF">Run ffmpeg demo</button></div>
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
        <pre id="log" style="height:200px; overflow:auto; background:#021216; padding:8px; border-radius:6px; margin-top:8px; color:#9bd6ff"></pre>
      </div>
    </div>

    <script src="src/app.js"></script>
  </body>
</html>
